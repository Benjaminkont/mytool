[project]
name = "mytool"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = ["openai", "python-dotenv", "httpx[socks]", "rich"]


[project.scripts]
mytool = "mytool.cli:main"

[tool.setuptools.packages.find]
include = ["mytool*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
