[project]
name = "mytool"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = ["openai", "python-dotenv", "httpx[socks]", "rich"]


[project.scripts]
mytool = "mytool.cli:main"

[tool.setuptools.packages.find]
include = ["mytool*"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
